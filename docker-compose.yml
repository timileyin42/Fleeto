services:
  db:
    image: postgres:16-alpine
    container_name: delivra_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: delivra
      POSTGRES_PASSWORD: delivra_dev
      POSTGRES_DB: delivra
    ports:
      - "5432:5432"
    volumes:
      - delivra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  delivra_pgdata:
